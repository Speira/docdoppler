[project]
name = "dicom-bridge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pynetdicom>=2.0.2",
    "pydicom>=2.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
